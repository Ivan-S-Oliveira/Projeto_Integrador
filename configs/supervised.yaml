temporal:
  modo: particao_mestra_por_grupo
  seed: 42
  coluna_grupo: group_id
  coluna_particao: particao
  coluna_estratificacao_temporal: ano_internacao
  coluna_estratificacao_alvo: alvo_obito_srag
  coluna_estratificacao_geografica: regiao_residencia
  gravar_particao_na_coorte: true
  permitir_novo_sorteio: false
  metodo_particao: hash_grupo_estratificado_mestre_v1
  min_grupos_por_estrato: 5
  fallback_estratificacao: reduzir_geografia_e_registrar_no_manifesto
  teste_aberto_uma_unica_vez: true
  blocos:
    train_ref:
      anos:
      - 2019
      - 2023
      - 2024
      - 2025
      fracao: 0.70
      papel: treino
      influencia_decisoes: true
    val_tune:
      anos:
      - 2019
      - 2023
      - 2024
      - 2025
      fracao: 0.05
      papel: selecao_de_features_geografia_e_tuning
      influencia_decisoes: true
    val_cal:
      anos:
      - 2019
      - 2023
      - 2024
      - 2025
      fracao: 0.05
      papel: calibracao_e_escolha_de_limiar
      influencia_decisoes: true
    val_meas:
      anos:
      - 2019
      - 2023
      - 2024
      - 2025
      fracao: 0.05
      papel: confirmacao_intermediaria_pre_teste
      influencia_decisoes: false
    test_ref:
      anos:
      - 2019
      - 2023
      - 2024
      - 2025
      fracao: 0.15
      papel: teste_a_resultado_principal
      influencia_decisoes: false
      requer_gate: G9_holdout
    test_pandemic:
      anos:
      - 2020
      - 2021
      - 2022
      papel: bloco_adicional_do_teste_b
      influencia_decisoes: false
      requer_gate: G9_holdout
  janelas_avaliacao:
    teste_a:
    - test_ref
    teste_b:
    - test_ref
    - test_pandemic
    relatorio_pandemico_separado: true
  exploracao_2026:
    ativa: false
    anos:
    - 2026
    somente_apos_fluxo_principal: true
    permitir_reajuste: false
  invariantes:
    grupos_disjuntos: true
    anos_pandemicos_exclusivos_test_pandemic: true
    ano_2026_fora_blocos_principais: true
    testes_fechados_ate_g9: true
    teste_b_uniao_logica_sem_duplicacao: true
    configuracao_congelada_entre_janelas: true
    preprocessamento_ajustado_so_no_treino: true

missingness:
  vazio_nao_e_nao: true
  ignorado_nao_e_nao: true
  nao_aplicavel_nao_e_nao: true
  ajustar_imputacao_apenas_no_treino: true
  numericas:
    imputacao: mediana
  categoricas:
    imputacao: categoria_explicita
    valor_ausente: AUSENTE
  indicadores_ausencia:
    pipeline_principal: false
    sensibilidade: true

models:
  baseline:
    strategy: prior
  logistic:
    C: null
    busca_C:
    - 0.001
    - 0.01
    - 0.1
    - 1.0
    - 10.0
    penalty: l2
    solver: lbfgs
    max_iter: 1000
    class_weight: balanced
  decision_tree:
    ativa: true
    max_depth:
    - 3
    - 5
    - 8
    - null
    min_samples_leaf:
    - 20
    - 50
    - 100
    class_weight: balanced
  random_forest:
    ativa: true
    n_estimators: 300
    max_depth:
    - 6
    - 10
    - null
    min_samples_leaf:
    - 10
    - 20
    - 50
    max_features:
    - sqrt
    - log2
    class_weight: balanced
    n_jobs: -1
  boosting:
    learning_rate: null
    busca_learning_rate:
    - 0.03
    - 0.05
    - 0.1
    max_iter: null
    busca_max_iter:
    - 300
    - 500
    - 1000
    max_depth: null
    busca_max_depth:
    - null
    - 4
    - 6
    - 8
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 0.0
    early_stopping: false
    class_weight: balanced

tuning:
  metrica_principal: pr_auc
  concentrar_nos_dois_melhores: true
  usar_apenas_treino_validacao: true
  teste_proibido_durante_tuning: true
  max_configuracoes_por_modelo: 30

calibracao:
  ativa: true
  metodo: null
  metodos_candidatos:
  - sigmoid
  - isotonic
  fonte: validacao
  comparar_brier_antes_depois: true

limiar:
  default: 0.5
  otimo: null
  metrica: null
  metricas_candidatas:
  - f1
  - recall
  - precision
  min_precision: null
  selecionar_somente_na_validacao: true

avaliacao:
  metrica_principal: pr_auc
  metricas:
  - pr_auc
  - roc_auc
  - brier_score
  - log_loss
  - recall
  - precision
  - f1
  - especificidade
  - sensibilidade
  - matriz_confusao
  grupos:
  - sg_uf
  - sexo_categoria
  - faixa_etaria
  - ano_internacao
  min_n_grupo: 100
  desempenho_por_ano: true
  calibracao_por_ano: true
  bootstrap:
    ativo: true
    repeticoes: 1000
    nivel: 0.95
    seed: 42
  analise_erros:
    ativa: true
    priorizar_falsos_negativos: true
  janelas:
    teste_a:
      blocos:
      - test_ref
      resultado_principal: true
    teste_b:
      blocos:
      - test_ref
      - test_pandemic
      resultado_principal: false
    pandemico_isolado:
      blocos:
      - test_pandemic
      obrigatorio: true
  comparacao_temporal:
    interpretacao: sensibilidade_a_composicao_temporal
    interpretacao_causal_permitida: false
    mesmo_modelo_features_hiperparametros_calibrador_e_limiar: true
  relatar_por_ano: true
  relatar_prevalencia: true
  relatar_pr_auc_sobre_prevalencia: true

sensibilidades:
  temporal:
    ativa: true
  com_sem_indicadores_ausencia:
    ativa: true
  sem_saturacao_desc_resp:
    ativa: true
  contexto_incremental:
    ativa: true
  alvo_qualquer_obito:
    ativa: true

artefatos_coorte:
  parquet: coorte_final.parquet
  waterfall: coorte_waterfall.csv
  variaveis: variaveis_finais.csv
  manifesto: manifesto_coorte.json
  particao_mestra: partitions_master.parquet
  manifesto_particao: manifesto_particao.json
  contrato_features: feature_contract_v1.json

gates:
  G1_definicao_alvo_features:
    descricao: >-
      Confirmar schema da coorte definitiva, alvo e lista final de features.
      As variaveis saturacao e desc_resp permanecem na analise de sensibilidade
      de gravidade na admissao; vacina e vacina_cov permanecem como contexto
      incremental, fora do conjunto principal.
    status: aprovado
    aprovado_por: time_do_projeto
    data: '2026-10-22'
  G2_janela_temporal:
    descricao: >-
      Desenvolvimento em 2019, 2023, 2024 e 2025; teste de referencia nos
      mesmos anos com grupos nao vistos; 2020 a 2022 apenas no teste pandemico;
      2026 apenas como exploracao posterior. Particao mestra deterministica
      por grupo, seed 42.
    status: aprovado
    aprovado_por: time_do_projeto
    data: '2026-10-18'
  G4_baseline:
    descricao: Rodar DummyClassifier e registrar as metricas de referencia.
    status: aprovado
    aprovado_por: time_do_projeto
    data: '2026-10-11'
  G5_pilotos:
    descricao: Rodar regressao logistica, arvore, random forest e boosting sem consultar o teste.
    status: aprovado
    aprovado_por: time_do_projeto
    data: '2026-10-11'
  G6_finalistas_tuning:
    descricao: >-
      Selecionar no maximo dois finalistas e executar tuning limitado.
      Ao final, preencher selecao_modelos.finalista_escolhido.
    status: pendente
    aprovado_por: null
    data: null
  G7_calibracao:
    descricao: Escolher o metodo de calibracao usando apenas treino e validacao.
    status: pendente
    aprovado_por: null
    data: null
  G8_limiar:
    descricao: Escolher o limiar operacional usando apenas a validacao.
    status: pendente
    aprovado_por: null
    data: null
  G9_holdout:
    descricao: >-
      Liberar test_ref e test_pandemic uma unica vez depois de congelar
      features, modelo, hiperparametros, calibrador e limiar. O estado
      aprovado libera o acesso; executado registra a consulta e e terminal.
    status: pendente
    aprovado_por: null
    data: null
    executado_em: null
    n_acessos: 0

selecao_modelos:
  status: shortlist_provisoria
  origem: pilotos
  teste_consultado: false
  finalistas:
  - hist_gradient_boosting
  - logistic
  nomes_execucao:
    hist_gradient_boosting: hist_gradient_boosting_v2
    logistic: logistica_C1_v2
  finalista_escolhido: null
  familias_encerradas:
  - decision_tree
  - random_forest
  criterio_principal: pr_auc
  observacoes:
  - probabilidades brutas ainda nao calibradas
  - decisao sujeita a repeticao na coorte definitiva
  - a escolha final usa somente os blocos de desenvolvimento
  - test_ref e test_pandemic permanecem fechados ate autorizacao formal