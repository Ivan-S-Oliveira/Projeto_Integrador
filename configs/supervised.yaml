# =============================================================================
# Configuração do pipeline supervisionado — Projeto Integrador
# =============================================================================
#
# Este arquivo é a fonte única de verdade para C2–C6.
# Nenhum notebook deve hard-coded hiperparâmetro, fração de split ou limiar.
#
# REGRA:
#   Valores marcados com `null` ou `"TBD"` só podem ser preenchidos
#   DEPOIS que o gate correspondente for aprovado.
#   Enquanto estiverem nulos, o loader levanta erro explícito ao tentar usá-los.
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# Reprodutibilidade
# -----------------------------------------------------------------------------
seed: 42

# -----------------------------------------------------------------------------
# Alvo
# -----------------------------------------------------------------------------
target:
  coluna: evolucao

  # Valor(es) de `evolucao` que contam como positivo (óbito SRAG).
  # 1 = cura | 2 = óbito SRAG | 3 = óbito outras causas | 9 = ignorado
  positivos: [2.0]
  negativos: [1.0]

  # Descarta 3, 9 e nulos — ficam fora do alvo binário.
  descartar_outros: true

# -----------------------------------------------------------------------------
# Coluna temporal (usada no split)
# -----------------------------------------------------------------------------
coluna_tempo: dt_notific

# -----------------------------------------------------------------------------
# Features
# -----------------------------------------------------------------------------
# Estrutura definida agora; lista final consolidada após o gate G1.
features:
  numericas:
    - idade_anos
    - intervalo_sint_interna_dias
    - flag_intervalo_invalido
    - sin_semana
    - cos_semana

  categoricas:
    - sg_uf
    - cs_sexo
    - cs_gestant          # antes: tp_gestante (schema real provável)
    - febre
    - tosse
    - dispneia
    - saturacao
    # internado e utilizouvni removidos: conferir se existem na admissão.
    # Se confirmados como disponíveis na admissão, reintroduzir com nomes reais.
    - vacina_cov
    - faixa_etaria        # derivada de idade_anos

  # Lista final só é fechada depois do gate G1 (definição do alvo e features).
  # Enquanto `null`, o loader usa `numericas + categoricas`.
  final: null

  # Colunas que NUNCA podem entrar em X (vazamento de alvo).
  # Servem de invariante para o `test_leakage.py`.
  proibidas:
    - evolucao
    - evolucao_covid19
    - dt_evoluca          # antes: dt_evolucao
    - dt_encerra          # antes: dt_encerramento
    - dt_digita
    # Conferir nomes reais no schema antes de fechar:
    - classificacao_final
    - criterio_confirmacao
    - sorologia
    - pcr

  # ---------------------------------------------------------------------------
  # Engenharia de atributos (src/features/engineering.py)
  # ---------------------------------------------------------------------------
  # Parâmetros e inventário das colunas derivadas. Todas as funções são
  # puras; `montar_features(df)` aplica todas e devolve uma cópia de `df`.
  #
  # ATENÇÃO: `dt_interna` (internação) precisa ser reconhecida pelo gate
  # G1 como disponível no momento da admissão. Enquanto G1 estiver
  # pendente, `intervalo_sint_interna_dias` e `flag_intervalo_invalido`
  # são candidatos, não decisão congelada.
  engenharia:
    # Limite superior (dias) para o intervalo sintomas→internação.
    # Acima disso, o intervalo vira NaN e a flag sobe para 1.
    intervalo_max_dias: 60

    # Faixas etárias interpretadas como intervalo semiaberto [min, max).
    # `max: null` significa "sem limite superior".
    faixas_etarias:
      - {nome: "<1",    min: 0,  max: 1}
      - {nome: "1-4",   min: 1,  max: 5}
      - {nome: "5-11",  min: 5,  max: 12}
      - {nome: "12-17", min: 12, max: 18}
      - {nome: "18-39", min: 18, max: 40}
      - {nome: "40-59", min: 40, max: 60}
      - {nome: "60-79", min: 60, max: 80}
      - {nome: "80+",   min: 80, max: null}

    # Colunas produzidas por montar_features() — NÃO existem no Parquet
    # bruto; por isso ficam separadas em `derivadas`.
    derivadas:
      - idade_anos
      - intervalo_sint_interna_dias
      - flag_intervalo_invalido
      - sin_semana
      - cos_semana
      - faixa_etaria

    # Colunas de entrada exigidas pela derivação (precisam estar no
    # Parquet). `coluna_tempo` (dt_notific) também é usada por
    # `sazonalidade`, mas vem do bloco `coluna_tempo`.
    entradas:
      - nu_idade_n
      - tp_idade
      - dt_sin_pri
      - dt_interna

# -----------------------------------------------------------------------------
# Split temporal
# -----------------------------------------------------------------------------
# Split por fração. Chaves de modo/datas/exigir_conclusao_selecao removidas.
temporal:
  fracao:
    treino:    0.70
    validacao: 0.15
    holdout:   0.15

# -----------------------------------------------------------------------------
# Modelos
# -----------------------------------------------------------------------------
# Valores marcados como null serão definidos nos gates:
#   G3 → baseline (referência fixa, valores já definidos abaixo)
#   G4 → regressão logística (busca de C e class_weight)
#   G5 → boosting (busca de learning_rate, max_iter, etc.)
models:

  baseline:
    # Não depende de tuning — é a referência mínima.
    strategy: prior

  logistic:
    # Valores iniciais razoáveis. Gate G4 decide se ficam.
    C: null                   # TBD: busca em [1e-3, 1e-2, 1e-1, 1, 10]
    penalty: l2
    solver: lbfgs
    max_iter: 1000
    class_weight: balanced

  boosting:
    # Valores iniciais razoáveis. Gate G5 decide se ficam.
    learning_rate: null       # TBD: busca em [0.01, 0.03, 0.05, 0.1]
    max_iter: null            # TBD: busca em [300, 500, 1000] na validação temporal
    max_depth: null           # TBD: [None, 4, 6, 8]
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 0.0
    early_stopping: false
    class_weight: balanced

# -----------------------------------------------------------------------------
# Calibração
# -----------------------------------------------------------------------------
# Gate G6 decide o método e onde calibrar (validação vs pedaço do treino).
calibracao:
  ativa: true
  metodo: null                # TBD: "isotonic" | "sigmoid"
  fonte: null                 # TBD: "validacao" | "treino_tail"
  frac_treino_tail: 0.10      # usado se `fonte == "treino_tail"`

# -----------------------------------------------------------------------------
# Limiar de decisão
# -----------------------------------------------------------------------------
# Gate G7 decide o limiar operacional (trade-off recall × precision).
limiar:
  default: 0.50               # usado enquanto o gate não fecha
  otimo: null                 # TBD: preenchido pelo gate G7
  metrica: f1                 # "f1" | "recall" | "precision" | "accuracy"
  min_precision: null         # TBD: se contexto clínico exigir, ex.: 0.5

# -----------------------------------------------------------------------------
# Métricas e avaliação
# -----------------------------------------------------------------------------
# Bloco enxuto: apenas grupos e min_n_grupo.
# `min_n_grupo` deve ser lido pelas funções de métricas por grupo.
avaliacao:
  grupos:
    - sg_uf
    - cs_sexo
    - faixa_etaria
  min_n_grupo: 100

# -----------------------------------------------------------------------------
# Clustering (apresentação na admissão, sem alvo)
# -----------------------------------------------------------------------------
# Variáveis consideradas disponíveis no momento da admissão. Usadas
# exclusivamente pelo dataset de clustering (EDA não supervisionada).
#
# ATENÇÃO: NÃO inclua aqui nada de `features.proibidas` nem colunas
# posteriores à admissão. O `check_leakage` roda sobre este dataset e
# falha se encontrar qualquer item da lista de proibidas.
#
# Lista provisória — sujeita a revisão do gate G1.
clustering:
  features:
    - idade_anos
    - sg_uf
    - cs_sexo
    - cs_gestant
    - febre
    - tosse
    - dispneia
    - saturacao
    - vacina_cov

# =============================================================================
# GATES
# =============================================================================
# Cada gate marca uma decisão que precisa ser tomada ANTES de rodar a próxima
# etapa. O campo `status` evolui de "pendente" para "aprovado".
# Enquanto houver gate pendente, notebooks C3+ recusam rodar.
# =============================================================================
gates:

  G1_definicao_alvo_features:
    descricao: >
      Definir alvo binário definitivo (quais valores de `evolucao`
      contam como positivo) e a lista final de features.
    status: pendente
    aprovado_por: null
    data: null

  G2_janela_temporal:
    descricao: >
      Definir janelas de treino / validação / holdout. Pode ser por fração
      (modo atual) ou por datas explícitas.
    status: pendente
    aprovado_por: null
    data: null

  G3_baseline:
    descricao: >
      Rodar `DummyClassifier` e registrar AUC/accuracy de referência.
      Nenhum modelo precisa superar — serve para calibrar expectativas.
    status: pendente
    aprovado_por: null
    data: null

  G4_logistica:
    descricao: >
      Buscar C e class_weight da regressão logística na validação.
      Preencher `models.logistic.C`.
    status: pendente
    aprovado_por: null
    data: null

  G5_boosting:
    descricao: >
      Buscar learning_rate / max_iter / max_depth na validação.
      Preencher os campos `null` em `models.boosting`.
    status: pendente
    aprovado_por: null
    data: null

  G6_calibracao:
    descricao: >
      Escolher método de calibração (isotonic vs sigmoid) e fonte
      (validação vs treino_tail). Medir ECE antes/depois.
    status: pendente
    aprovado_por: null
    data: null

  G7_limiar:
    descricao: >
      Escolher limiar operacional. Se contexto clínico exigir precisão
      mínima, preencher `min_precision`.
    status: pendente
    aprovado_por: null
    data: null

  G8_holdout:
    descricao: >
      Liberar holdout UMA única vez. Rodar após G7.
      Registrar métricas finais em `outputs/runs/<RUN_ID>/metadata.json`.
    status: pendente
    aprovado_por: null
    data: null