temporal:
  modo: particao_mestra_por_grupo
  seed: 42
  coluna_grupo: group_id
  coluna_particao: particao
  coluna_estratificacao_temporal: ano_internacao
  coluna_estratificacao_alvo: alvo_obito_srag
  coluna_estratificacao_geografica: regiao_residencia
  gravar_particao_na_coorte: true
  metodo_particao: hash_grupo_estratificado_mestre_v1
  min_grupos_por_estrato: 5
  blocos:
    train_ref:
      anos:
      - 2019
      - 2023
      - 2024
      - 2025
      fracao: 0.70
      papel: treino
      influencia_decisoes: true
    val_ref:
      anos:
      - 2019
      - 2023
      - 2024
      - 2025
      fracao: 0.15
      papel: validacao_tuning_calibracao_e_limiar
      influencia_decisoes: true
    test_ref:
      anos:
      - 2019
      - 2023
      - 2024
      - 2025
      fracao: 0.15
      papel: teste_a_resultado_principal
      influencia_decisoes: false
      requer_gate: G9_holdout
    test_pandemic:
      anos:
      - 2020
      - 2021
      - 2022
      papel: bloco_adicional_do_teste_b
      influencia_decisoes: false
      requer_gate: G9_holdout
  janelas_avaliacao:
    teste_a:
    - test_ref
    teste_b:
    - test_ref
    - test_pandemic
    relatorio_pandemico_separado: true
  exploracao_2026:
    ativa: false
    anos:
    - 2026
    somente_apos_fluxo_principal: true
    permitir_reajuste: false

missingness:
  categoricas:
    imputacao: categoria_explicita
    valor_ausente: AUSENTE

models:
  baseline:
    strategy: prior
  logistic:
    C: 10.0
    busca_C:
    - 10.0
    penalty: l2
    solver: lbfgs
    max_iter: 1000
    class_weight: {}
    busca_class_weight:
    - null
  boosting:
    learning_rate: 0.05
    max_iter: 500
    max_depth: null
    max_leaf_nodes: 63
    min_samples_leaf: 100
    l2_regularization: 0.1
    class_weight: {}
    busca_learning_rate:
    - 0.05
    busca_max_iter:
    - 500
    busca_max_depth:
    - null
    busca_max_leaf_nodes:
    - 63
    busca_min_samples_leaf:
    - 100
    busca_l2_regularization:
    - 0.1
    busca_class_weight:
    - null

tuning:
  metrica_principal: pr_auc
  max_configuracoes_por_modelo: 30

calibracao:
  ativa: true
  metodo: sigmoid
  metodos_candidatos:
  - sigmoid
  - isotonic
  fonte: validacao

limiar:
  default: 0.5
  otimo: 0.1178
  metrica: precision
  min_precision: null
  min_recall: 0.80

avaliacao:
  metrica_principal: pr_auc
  metricas:
  - pr_auc
  - roc_auc
  - brier_score
  - log_loss
  - recall
  - precision
  - f1
  - especificidade
  - sensibilidade
  - matriz_confusao
  grupos:
  - sg_uf
  - sexo_categoria
  - faixa_etaria
  - ano_internacao
  - cs_raca
  - cs_zona
  min_n_grupo: 100
  calibracao_por_ano: true
  bootstrap:
    repeticoes: 1000
    nivel: 0.95
    seed: 42
  analise_erros:
    ativa: true
  janelas:
    teste_a:
      blocos:
      - test_ref
      resultado_principal: true
    teste_b:
      blocos:
      - test_ref
      - test_pandemic
      resultado_principal: false
    pandemico_isolado:
      blocos:
      - test_pandemic
      obrigatorio: true

gates:
  G1_definicao_alvo_features:
    descricao: >-
      Confirmar schema da coorte definitiva, alvo e lista final de features.
      Em 03/11, saturacao e desc_resp entraram no conjunto principal e perd_olft,
      perd_pala e fadiga sairam (decisoes.md 29.34); vacina e vacina_cov permanecem como contexto
      incremental, fora do conjunto principal.
    status: aprovado
    aprovado_por: time_do_projeto
    data: '2026-10-22'
  G2_janela_temporal:
    descricao: >-
      Desenvolvimento em 2019, 2023, 2024 e 2025; teste de referência nos
      mesmos anos com grupos nao vistos; 2020 a 2022 apenas no teste pandemico;
      2026 apenas como exploracao posterior. Particao mestra deterministica
      por grupo, seed 42.
    status: aprovado
    aprovado_por: time_do_projeto
    data: '2026-10-18'
  G4_baseline:
    descricao: Rodar DummyClassifier e registrar as metricas de referencia.
    status: aprovado
    aprovado_por: time_do_projeto
    data: '2026-10-11'
  G5_pilotos:
    descricao: Rodar regressao logistica, arvore, random forest e boosting sem consultar o teste.
    status: aprovado
    aprovado_por: time_do_projeto
    data: '2026-10-11'
  G6_finalistas_tuning:
    descricao: >-
      Selecionar no maximo dois finalistas e executar tuning limitado.
      Ao final, preencher selecao_modelos.finalista_escolhido.
    status: aprovado
    aprovado_por: equipe
    data: '2026-11-03'
  G7_calibracao:
    descricao: Escolher o metodo de calibracao usando apenas treino e validacao.
    status: aprovado
    aprovado_por: time_do_projeto
    data: '2026-11-04'
  G8_limiar:
    descricao: Escolher o limiar operacional usando apenas a validacao.
    status: aprovado
    aprovado_por: time_do_projeto
    data: '2026-11-05'
  G9_holdout:
    descricao: >-
      Liberar test_ref e test_pandemic uma unica vez depois de congelar
      features, modelo, hiperparametros, calibrador e limiar. O estado
      aprovado libera o acesso; executado registra a consulta e e terminal.
    status: executado
    aprovado_por: equipe
    data: '2026-11-05'
    executado_em: "2026-11-07T00:32:00.678246+00:00"
    n_acessos: 2

selecao_modelos:
  status: finalista_congelado
  finalistas:
  - hist_gradient_boosting
  - logistic
  finalista_escolhido: boosting
  observacoes:
  - probabilidades brutas ainda nao calibradas
  - decisao congelada em 2026-11-03
  - a escolha final usou somente os blocos de desenvolvimento
  - test_ref e test_pandemic foram abertos uma unica vez em 05/11/2026 (G9)